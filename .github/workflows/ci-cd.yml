name: CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: "2023.1.22f1"

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden folders
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^|/)(Library|Temp|Obj|Logs|UserSettings)/' || true)
          [ -z "$FORBIDDEN" ] || { echo "$FORBIDDEN"; exit 1; }

      - name: Merge conflicts
        run: |
          CONFLICTS=$(git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.cs' '*.unity' '*.prefab' '*.asset' '*.mat' || true)
          [ -z "$CONFLICTS" ] || { echo "$CONFLICTS"; exit 1; }

      - name: Unity version
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -path "*/ProjectSettings/ProjectVersion.txt" | head -n 1)
          [ -z "$PROJECT_FILE" ] && exit 0
          ACTUAL=$(grep "m_EditorVersion:" "$PROJECT_FILE" | awk '{print $2}' | tr -d '\r')
          [ "$ACTUAL" = "$UNITY_VERSION" ] || exit 1

      - name: Meta files
        run: |
          ASSETS_DIR=$(find . -maxdepth 2 -type d -name "Assets" | head -n 1)
          [ -z "$ASSETS_DIR" ] && exit 0
          ERR=0
          while IFS= read -r -d '' item; do
            [ -f "${item}.meta" ] || { echo "Missing: ${item}.meta"; ERR=1; }
          done < <(find "$ASSETS_DIR" -mindepth 1 \( ! -name "*.meta" ! -path "*/.*" \) -print0)
          while IFS= read -r -d '' meta; do
            [ -e "${meta%.meta}" ] || { echo "Orphaned: $meta"; ERR=1; }
          done < <(find "$ASSETS_DIR" -mindepth 1 -name "*.meta" ! -path "*/.*" -print0)
          exit $ERR

  build:
    needs: pr-checks
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.check.outputs.run_unity }}
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - id: check
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -path "*/ProjectSettings/ProjectVersion.txt" | head -n 1)
          if [ -z "$PROJECT_FILE" ] || [ -z "$UNITY_SERIAL" ]; then
            echo "run_unity=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "project_path=$(dirname "$(dirname "$PROJECT_FILE")")" >> $GITHUB_OUTPUT
          echo "run_unity=true" >> $GITHUB_OUTPUT

      - if: steps.check.outputs.run_unity == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.check.outputs.project_path }}/Library
          key: Library-WebGL-${{ hashFiles(format('{0}/Assets/**', steps.check.outputs.project_path), format('{0}/Packages/**', steps.check.outputs.project_path), format('{0}/ProjectSettings/**', steps.check.outputs.project_path)) }}
          restore-keys: Library-WebGL-

      - if: steps.check.outputs.run_unity == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.check.outputs.project_path }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.check.outputs.run_unity == 'true'
        name: Clean test artifacts
        run: |
          sudo rm -rf artifacts CodeCoverage
          docker image prune -a -f || true
          git checkout -- .

      - if: steps.check.outputs.run_unity == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.check.outputs.project_path }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildsPath: build
          versioning: None
          allowDirtyBuild: true

      - id: release-version
        if: steps.check.outputs.run_unity == 'true' && github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            TAG=$(echo "$COMMIT_MSG" | grep -o -E '\bv[0-9]+(\.[0-9]+)*\b' | head -n 1 || true)
          else
            TAG=""
          fi

          if [ -n "$TAG" ]; then
            VER_NUM="${TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER_NUM"
            MAJOR="${MAJOR:-0}"
            MINOR="${MINOR:-0}"
            PATCH="${PATCH:-0}"

            if [ "$MAJOR" -ge 1 ]; then
              STAGE="Production"
            else
              STAGE="Prototype"
            fi

            if [ "$PATCH" -gt 0 ] || echo "$COMMIT_MSG" | grep -iq "patch"; then
              KIND="Patch"
            elif [ "$MAJOR" -ge 1 ] && [ "$MINOR" -eq 0 ] && [ "$PATCH" -eq 0 ]; then
              KIND="Release"
            elif [ "$MAJOR" -eq 0 ] && [ "$MINOR" -le 1 ] && [ "$PATCH" -eq 0 ]; then
              KIND="Release"
            else
              KIND="Update"
            fi

            TITLE="$TAG - $STAGE $KIND"
            STAGE_LOWER=$(echo "$STAGE" | tr '[:upper:]' '[:lower:]')
            KIND_LOWER=$(echo "$KIND" | tr '[:upper:]' '[:lower:]')

            echo "Playable WebGL build of the $STAGE_LOWER $KIND_LOWER." > release_notes.md
            echo "" >> release_notes.md
            echo "## Play Online" >> release_notes.md
            echo "You can play the game directly in your browser:" >> release_notes.md
            echo "* [Play WebGL Build](https://defaultadam.github.io/Wizard-Tower-Defence/)" >> release_notes.md

            echo "publish=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=$TITLE" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.release-version.outputs.publish == 'true'
        name: Package WebGL release
        run: |
          cd build/WebGL/WebGL
          zip -r ../../../Wizard-Tower-Defence-${{ steps.release-version.outputs.tag }}-webgl.zip .

      - if: steps.release-version.outputs.publish == 'true'
        name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: ${{ steps.release-version.outputs.title }}
          body_path: release_notes.md
          files: Wizard-Tower-Defence-${{ steps.release-version.outputs.tag }}-webgl.zip
          generate_release_notes: true

      - if: steps.check.outputs.run_unity == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.build.outputs.built == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
